<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="simple.css">
</head>

<body>

    <div class="register-container">

        <h1>Register</h1>

        <p class="description">
            Kindly fill in this form to register.
        </p>

        <form id="registerForm">
            <div><label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>

            <div><label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter Email" required>
            </div>


            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter Password" minlength="8" required>

            <label for="repeatPassword">Repeat Password</label>
            <input type="password" id="repeatPassword" name="repeatPassword" placeholder="Repeat Password" minlength="8"
                required>

            <button type="submit" class="register-button">
                Register
            </button>

            <p id="message"></p>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Log in.</a>
        </p>

    </div>

    <script>
        const form = document.getElementById("registerForm");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const repeatPassword =
                document.getElementById("repeatPassword").value;

            const message = document.getElementById("message");

            if (password !== repeatPassword) {
                message.style.color = "red";
                message.textContent = "Passwords do not match!";
                return;
            }

            message.style.color = "green";
            message.textContent = "Registration form validated successfully!";
        });
    </script>

</body>

</html>
