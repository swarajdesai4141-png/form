<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="instagram.css">
</head>

<body>

    <div class="container">

        <!-- Left Section -->
        <div class="left-section">

            <div class="logo">
                <svg viewBox="0 0 24 24" width="55" height="55" fill="none" stroke="url(#gradient)" stroke-width="2">
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="1" x2="1" y2="0">
                            <stop offset="0%" stop-color="#ffb347" />
                            <stop offset="50%" stop-color="#ff4b7d" />
                            <stop offset="100%" stop-color="#c13584" />
                        </linearGradient>
                    </defs>
                    <rect x="3" y="3" width="18" height="18" rx="5" />
                    <circle cx="12" cy="12" r="4" />
                    <circle cx="17.5" cy="6.5" r="1" fill="#ff4b7d" stroke="none" />
                </svg>
            </div>

            <h1>
                See everyday moments from<br>
                your <span>close friends.</span>
            </h1>

            <div class="photos">
                <div class="photo photo1">😊</div>
                <div class="photo photo2">👫</div>
                <div class="photo photo3">🌴</div>
            </div>

            <p class="app-store">App Store</p>

        </div>

        <!-- Right Section -->
        <div class="right-section">

            <h3>Log into Instagram</h3>

            <form>
                <input type="text" placeholder="Mobile number, username or email" required>

                <input type="password" placeholder="Password" required>

                <button type="submit" class="login-btn">
                    Log in
                </button>
            </form>

            <a href="#" class="forgot">Forgot password?</a>

            <button class="facebook-btn">
                <span>f</span> Log in with Facebook
            </button>

            <button class="create-btn">
                Create new account
            </button>

        </div>

    </div>

</body>

</html>
