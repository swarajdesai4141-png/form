<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>

    <link rel="stylesheet" href="welcome.css">

    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- Left Welcome Panel -->
        <div class="welcome-panel">
            <h1>Welcome Back!</h1>

            <p>
                Provide your personal details to use all
                features
            </p>

            <button class="signin-btn" type="button">
                SIGN IN
            </button>
        </div>

        <!-- Right Registration Panel -->
        <div class="register-panel">

            <h1>Register With</h1>

            <div class="social-icons">
                <a href="#" aria-label="Google">
                    <i class="fa-brands fa-google"></i>
                </a>

                <a href="#" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a href="#" aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="#" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>
            </div>

            <h2>OR</h2>

            <p class="form-description">
                Fill Out The Following Info For Registration
            </p>

            <form action="#" method="post">

                <input type="text" name="name" placeholder="Name" autocomplete="name" required>

                <input type="email" name="email" placeholder="Email" autocomplete="email" required>

                <input type="password" name="password" placeholder="Password" autocomplete="new-password" minlength="8"
                    required>

                <button class="signup-btn" type="submit">
                    SIGN UP
                </button>

            </form>
        </div>

    </div>

</body>

</html>
